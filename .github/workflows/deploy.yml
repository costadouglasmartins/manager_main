name: Deploy manager_main

on:
  push:
    branches: [main, codex/github-deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manager-main-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/github-deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the application
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate or publish the application
        env:
          DEPLOY_MODE: ${{ github.ref == 'refs/heads/main' && 'apply' || 'dry-run' }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: bash .github/scripts/deploy.sh
